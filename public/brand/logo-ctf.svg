<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="CTF ACADEMY">
  <!-- TODO: logo officiel — médaillon provisoire reproduisant la maquette (anneau orné + croix stylisée) -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3D982"/>
      <stop offset="0.35" stop-color="#E5C158"/>
      <stop offset="0.6" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8B6F1A"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#232018"/>
      <stop offset="0.6" stop-color="#141414"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Anneau d'ornement : graduations façon laurier (tourne lentement côté composant) -->
  <g class="ornament" filter="url(#soft)">
    <circle cx="120" cy="120" r="112" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="120" cy="120" r="98" fill="none" stroke="url(#gold)" stroke-width="1.6" opacity="0.9"/>
    <g stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round">
      <g id="ticks">
        <path d="M120 12v14"/>
      </g>
      <use href="#ticks" transform="rotate(15 120 120)"/>
      <use href="#ticks" transform="rotate(30 120 120)"/>
      <use href="#ticks" transform="rotate(45 120 120)"/>
      <use href="#ticks" transform="rotate(60 120 120)"/>
      <use href="#ticks" transform="rotate(75 120 120)"/>
      <use href="#ticks" transform="rotate(90 120 120)"/>
      <use href="#ticks" transform="rotate(105 120 120)"/>
      <use href="#ticks" transform="rotate(120 120 120)"/>
      <use href="#ticks" transform="rotate(135 120 120)"/>
      <use href="#ticks" transform="rotate(150 120 120)"/>
      <use href="#ticks" transform="rotate(165 120 120)"/>
      <use href="#ticks" transform="rotate(180 120 120)"/>
      <use href="#ticks" transform="rotate(195 120 120)"/>
      <use href="#ticks" transform="rotate(210 120 120)"/>
      <use href="#ticks" transform="rotate(225 120 120)"/>
      <use href="#ticks" transform="rotate(240 120 120)"/>
      <use href="#ticks" transform="rotate(255 120 120)"/>
      <use href="#ticks" transform="rotate(270 120 120)"/>
      <use href="#ticks" transform="rotate(285 120 120)"/>
      <use href="#ticks" transform="rotate(300 120 120)"/>
      <use href="#ticks" transform="rotate(315 120 120)"/>
      <use href="#ticks" transform="rotate(330 120 120)"/>
      <use href="#ticks" transform="rotate(345 120 120)"/>
    </g>
    <g fill="url(#gold)">
      <circle id="bead" cx="120" cy="12" r="4"/>
      <use href="#bead" transform="rotate(22.5 120 120)"/>
      <use href="#bead" transform="rotate(67.5 120 120)"/>
      <use href="#bead" transform="rotate(112.5 120 120)"/>
      <use href="#bead" transform="rotate(157.5 120 120)"/>
      <use href="#bead" transform="rotate(202.5 120 120)"/>
      <use href="#bead" transform="rotate(247.5 120 120)"/>
      <use href="#bead" transform="rotate(292.5 120 120)"/>
      <use href="#bead" transform="rotate(337.5 120 120)"/>
    </g>
  </g>

  <!-- Disque central -->
  <circle cx="120" cy="120" r="90" fill="url(#disc)" stroke="url(#gold)" stroke-width="1.2" opacity="0.98"/>
  <circle cx="120" cy="120" r="82" fill="none" stroke="#C9A227" stroke-width="0.8" opacity="0.35"/>

  <!-- Croix stylisée -->
  <g filter="url(#soft)">
    <path fill="url(#gold)" d="M112 66c0-4 3.6-7 8-7s8 3 8 7v22l-8 6-8-6z"/>
    <rect x="112" y="88" width="16" height="78" rx="8" fill="url(#gold)"/>
    <path fill="url(#gold)" d="M84 96c8-6 28-2 36 4 8-6 28-10 36-4 6 4 4 12-4 14-10 3-24 2-32-2-8 4-22 5-32 2-8-2-10-10-4-14z"/>
    <circle cx="120" cy="104" r="7" fill="url(#gold)"/>
  </g>
</svg>
